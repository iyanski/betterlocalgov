# Philippine Sports Commission — About the Agency
# This file contains all the government/institutional categories for the PSC portal
# Each category's index.yaml file is automatically located at content/government/{slug}/index.yaml
# Non-technical users can easily edit this file to add, remove, or modify categories
#
# NOTE: `icon` must be a valid lucide-react export name, and `slug` becomes a
# globally reserved document slug — it must not match any page slug.

categories:
  # About the PSC
  - category: 'About the PSC'
    slug: 'about-psc'
    description: 'What the Philippine Sports Commission is, where it came from, the law that created it, and how to reach it.'
    icon: 'Landmark'

  # Leadership
  - category: 'Leadership'
    slug: 'leadership'
    description: 'The Chairman and Commissioners who make up the Commission Proper, how the agency is organized, and which office to contact.'
    icon: 'UsersRound'

  # Transparency
  - category: 'Transparency'
    slug: 'transparency'
    description: 'Budget and audit documents, freedom of information requests, the Citizen''s Charter, and quality management compliance.'
    icon: 'FileText'

  # Procurement
  - category: 'Procurement'
    slug: 'procurement'
    description: 'How to do business with the PSC — open bid opportunities, awards and notices, and the bid documents published by the Bids and Awards Committee.'
    icon: 'Gavel'

  # Careers
  - category: 'Careers'
    slug: 'careers'
    description: 'Job vacancies at the Philippine Sports Commission and how to apply.'
    icon: 'Briefcase'

# Philippine Sports Commission — Programs and Services
# This file contains all the service categories for the PSC portal
# Each category's index.yaml file is automatically located at content/services/{slug}/index.yaml
# Non-technical users can easily edit this file to add, remove, or modify service categories
#
# NOTE: `icon` must be a valid lucide-react export name, and `slug` becomes a
# globally reserved document slug — it must not match any page slug.

categories:
  # Grassroots Sports
  - category: 'Grassroots Sports'
    slug: 'grassroots-sports'
    description: 'National competitions and community programs open to young and first-time athletes — Batang Pinoy, the Philippine National Games, the Indigenous People Games, and more.'
    icon: 'Users'

  # National Athletes
  - category: 'National Athletes'
    slug: 'national-athletes'
    description: 'How athletes join the national pool, and the allowances, incentives, insurance, and education support available to national athletes and their coaches.'
    icon: 'Medal'

  # Sports Facilities
  - category: 'Sports Facilities'
    slug: 'sports-facilities'
    description: 'The training centers and venues the PSC runs — Rizal Memorial, PhilSports, Baguio, and Bataan — and how to use or book them.'
    icon: 'Building2'

  # Sports Development
  - category: 'Sports Development'
    slug: 'sports-development'
    description: 'Support for national sports associations, sports science and training services, safe sports policy, and capability-building programs for coaches and officials.'
    icon: 'Dumbbell'

  # Awards and Recognition
  - category: 'Awards and Recognition'
    slug: 'awards-and-recognition'
    description: 'How the country honors its athletes, from the Philippine Sports Hall of Fame to the Gintong Gawad and Women in Sports awards.'
    icon: 'Trophy'

  # Inclusive Sports
  - category: 'Inclusive Sports'
    slug: 'inclusive-sports'
    description: 'Programs that widen access to sport — the Pilipinas ParaGames, women in sports initiatives, and sports for inclusivity, heritage, and peace.'
    icon: 'Accessibility'

  # Partnerships and Assistance
  - category: 'Partnerships and Assistance'
    slug: 'partnerships-and-assistance'
    description: 'For local governments, schools, and sports organizations: how to partner with the PSC, request assistance, or host a PSC-backed event.'
    icon: 'Handshake'
